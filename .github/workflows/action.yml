name: Download Kaggle Dataset

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # 1. Upgraded from @v4 to @v6 for Node 24 support
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Upgraded from @v5 to @v6 for Node 24 support
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # The rest of your steps remain the same
      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Download Dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d deepeshkansotia/banking-fraud-detection-and-risk-analytics-dataset --unzip -p ./data

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Update dataset: $(date +'%Y-%m-%d')" || exit 0
          git push